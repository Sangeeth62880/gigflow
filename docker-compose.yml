services:
  server:
    build: ./server
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/gigflow}
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey123!}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5050/api}
    depends_on:
      - server

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - gigflow_data:/data/db

volumes:
  gigflow_data:
